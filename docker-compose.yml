version: '3.8'

services:
  # Open5GS 5G Core Network
  open5gs:
    build:
      context: .
      dockerfile: Dockerfile.open5gs
    container_name: open5gs-core
    hostname: open5gs
    privileged: true
    networks:
      ran:
        ipv4_address: 10.100.100.10
    ports:
      - "3000:3000"     # WebUI
      - "38412:38412"   # NGAP (AMF)
      - "2152:2152/udp" # GTP-U (UPF)
    environment:
      - TZ=UTC
    volumes:
      - ./open5gs-config:/etc/open5gs
      - /dev/net/tun:/dev/net/tun
    command: |
      sh -c "
        open5gs-nrfd -c /etc/open5gs/nrf.yaml &
        sleep 2 &&
        open5gs-smfd -c /etc/open5gs/smf.yaml &
        open5gs-amfd -c /etc/open5gs/amf.yaml &
        open5gs-upfd -c /etc/open5gs/upf.yaml &
        open5gs-ausfd -c /etc/open5gs/ausf.yaml &
        open5gs-udmd -c /etc/open5gs/udm.yaml &
        open5gs-pcfd -c /etc/open5gs/pcf.yaml &
        open5gs-nssfd -c /etc/open5gs/nssf.yaml &
        open5gs-bsfd -c /etc/open5gs/bsf.yaml &
        open5gs-udrd -c /etc/open5gs/udr.yaml &
        tail -f /dev/null
      "

  # UERANSIM (gNB + UE combined)
  ueransim:
    build:
      context: .
      dockerfile: Dockerfile.ueransim
    container_name: ueransim
    hostname: ueransim
    privileged: true
    networks:
      ran:
        ipv4_address: 10.100.100.20
    depends_on:
      - open5gs
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/ueransim/config
    stdin_open: true
    tty: true
    command: sh -c "nr-gnb -c config/open5gs-gnb.yaml & sleep 2 && nr-ue -c config/open5gs-ue.yaml"

networks:
  ran:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.100.0/24

