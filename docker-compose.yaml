services:
  gostwire:
    image: "ghcr.io/siemens/ghostwire"
    pull_policy: if_not_present
    restart: "unless-stopped"
    read_only: true
    entrypoint:
      - "/gostwire"
      - "--http=[::]:5000"
      - "--brand=Edgeshark"
      - "--"
    user: "65534"
    cap_drop:
      - ALL
    cap_add:
      - CAP_SYS_ADMIN # change namespaces
      - CAP_SYS_CHROOT # change mount namespaces
      - CAP_SYS_PTRACE # access nsfs namespace information
      - CAP_DAC_READ_SEARCH # access/scan /proc/[$PID]/fd itself
      - CAP_DAC_OVERRIDE # access container engine unix domain sockets without being rude, erm, root.
      - CAP_NET_RAW # pingin' 'round
      - CAP_NET_ADMIN # 'nuff tables
    pid: "host"
    cgroup: host
    networks:
      99-ghost-in-da-edge:
        priority: 100

  edgeshark:
    image: "ghcr.io/siemens/packetflix"
    pull_policy: "if_not_present"
    read_only: true
    restart: "unless-stopped"
    entrypoint:
      - "/packetflix"
      - "--port=5001"
      - "--discovery-service=gostwire.ghost-in-da-edge"
      - "--gw-port=5000"
      - "--proxy-discovery"
      - "--debug"

    ports:
      - "127.0.0.1:5001:5001"

    user: "65534"
    cap_drop:
      - ALL
    cap_add:
      - CAP_SYS_ADMIN # change namespaces
      - CAP_SYS_CHROOT # change mount namespaces
      - CAP_SYS_PTRACE # access nsfs namespace information
      - CAP_NET_ADMIN # allow dumpcap to control promisc. mode
      - CAP_NET_RAW # capture raw packets, and not that totally burnt stuff
    pid: "host"

    networks:
      99-ghost-in-da-edge:
        priority: 100

  debug-logs:
    container_name: debug-logs
    image: amir20/dozzle:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,Z
    environment:
      - DOZZLE_LEVEL=info
    networks:
      shared_network:
        ipv4_address: 10.10.0.9
    restart: unless-stopped

  mongodb:
    image: mongo
    container_name: open5gs-mongodb
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.2
    volumes:
      - mongodb:/data/db
      - ./config/open5gs/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro,Z
    environment:
      - MONGO_INITDB_DATABASE=open5gs
    command: mongod --bind_ip 0.0.0.0 --port 27018

  webui:
    depends_on:
      - mongodb
    build:
      context: .
      dockerfile: ./config/docker/Dockerfile.open5gs.webui
    image: ${USER}/open5gs-webui
    container_name: open5gs-webui
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.3
    ports:
      - "9999:9999"
    environment:
      - DB_URI=mongodb://10.10.0.2:27018/open5gs
      - WAIT_HOSTS=10.10.0.2:27018
      - HOSTNAME=0.0.0.0

  base:
    build:
      context: .
      dockerfile: ./config/docker/Dockerfile.base
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-base
    container_name: quicup-project-ubuntu-base
    restart: unless-stopped
    command: /bin/bash -c "echo 'base' services && sleep infinity"

  run:
    depends_on:
      - mongodb
      - base
    pull_policy: never
    build:
      context: .
      dockerfile: ./config/docker/Dockerfile.open5gs.run
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
        username: ${USER}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-open5gs-run
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.10
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    container_name: open5gs-run
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./config/open5gs/services:/usr/local/etc/open5gs:Z
      - ./config/secrets:/secrets:Z
    environment:
      - DB_URI=mongodb://10.10.0.2:27018/open5gs
    command: >
      /bin/bash -c "
      /wait &&
      /root/setup.sh &&
      open5gs-nrfd -D && sleep 2 &&
      open5gs-scpd -D && sleep 2 &&
      open5gs-amfd -D &&
      open5gs-smfd -D &&
      open5gs-upfd -D &&
      open5gs-ausfd -D &&
      open5gs-udmd -D &&
      open5gs-pcfd -D &&
      open5gs-nssfd -D &&
      open5gs-bsfd -D &&
      open5gs-udrd -D &&
      sleep infinity
      "

  ueransim-gnb:
    depends_on:
      - base
      - run
    pull_policy: never
    build:
      context: .
      dockerfile: ./config/docker/Dockerfile.ueransim
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
        username: ${USER}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-ueransim-gnb
    privileged: true
    container_name: ueransim-gnb
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.4
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - ./config/ueransim/open5gs-gnb.yaml:/ueransim/config/open5gs-gnb.yaml:Z
    command: /bin/bash -c "sleep 10 && build/nr-gnb -c /ueransim/config/open5gs-gnb.yaml"

  ueransim-ue:
    depends_on:
      - base
      - run
    pull_policy: never
    build:
      context: .
      dockerfile: ./config/docker/Dockerfile.ueransim
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
        username: ${USER}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-ueransim-ue
    container_name: ueransim-ue
    privileged: true
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.16
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - ./config/ueransim/open5gs-ue.yaml:/ueransim/config/open5gs-ue.yaml:Z
    command: /bin/bash -c "
      sleep 15 &&
      build/nr-ue -c /ueransim/config/open5gs-ue.yaml &
      until ip link show uesimtun0 >/dev/null 2>&1; do sleep 1; done;
      ip route del default via 10.10.0.1 2>/dev/null || true;
      ip route add default dev uesimtun0;
      wait
      "

volumes:
  mongodb: {}

networks:
  shared_network:
    name: shared_network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.name: br-open5gs
    ipam:
      config:
        - subnet: 10.10.0.0/16
  99-ghost-in-da-edge:
    name: ghost-in-da-edge
    internal: false
