apiVersion: apps/v1
kind: Deployment
metadata:
  name: { { .Values.gnb.name } }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: { { .Values.gnb.name } }
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: { { .Values.gnb.name } }
      annotations:
        k8s.v1.cni.cncf.io/networks: { { .Values.gnb.multus_cni_network_link } }
    spec:
      nodeSelector:
        tier: { { .Values.gnb.name } }
      containers:
        - name: { { .Values.gnb.name } }
          image: ueransim-gnb:latest
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          securityContext:
            capabilities:
              add:
                - "NET_ADMIN"
          ports:
            - containerPort: 38412
              protocol: SCTP
            - containerPort: 2152
              protocol: UDP
          command: ["/bin/bash", "-c"]
          args:
            - >-
              sleep 10 && build/nr-gnb -c /ueransim/config/open5gs-gnb.yaml
          volumeMounts:
            - name: gnb-config-vol
              mountPath: /ueransim/config/open5gs-gnb.yaml
              subPath: open5gs-gnb.yaml
      volumes:
        - name: gnb-config-vol
          configMap:
            name: { { .Values.gnb.config_map_name } }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: { { .Values.ue.name } }
spec:
  replicas: 1
  selector:
    matchLabels:
      app: { { .Values.ue.name } }
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: { { .Values.ue.name } }
      annotations:
        k8s.v1.cni.cncf.io/networks: { { .Values.ue.multus_cni_network_link } }
    spec:
      nodeSelector:
        tier: { { .Values.ue.name } }
      containers:
        - name: { { .Values.ue.name } }
          image: ueransim-ue:latest
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          command: ["/bin/bash", "-c"]
          args:
            - >-
              sleep 15 &&
              build/nr-ue -c /ueransim/config/open5gs-ue.yaml &
              until ip link show uesimtun0 >/dev/null 2>&1; do sleep 1; done;
              wait
          volumeMounts:
            - name: ue-config-vol
              mountPath: /ueransim/config/open5gs-ue.yaml
              subPath: open5gs-ue.yaml
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: ue-config-vol
          configMap:
            name: { { .Values.ue.config_map_name } }
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
