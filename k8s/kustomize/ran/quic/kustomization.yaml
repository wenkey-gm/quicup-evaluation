apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - ../../nads

configMapGenerator:
  - name: ueransim-gnb-config
    files:
      - open5gs-gnb.yaml=configs/open5gs-gnb-quic.yaml

  - name: ueransim-ue-config
    files:
      - open5gs-ue.yaml=configs/open5gs-ue-quic.yaml

images:
  - name: ueransim-gnb
    newName: localhost:5001/ubuntu-24.04-ueransim-gnb
    newTag: latest
  - name: ueransim-ue
    newName: localhost:5001/ubuntu-24.04-ueransim-ue
    newTag: latest
