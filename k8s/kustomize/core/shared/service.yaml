apiVersion: v1
kind: Service
metadata:
  name: open5gs-mongodb-svc
  labels:
    app: open5gs-mongodb
spec:
  type: ClusterIP
  selector:
    app: open5gs-mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: open5gs-webui-svc
  labels:
    app: open5gs-webui
spec:
  type: NodePort
  selector:
    app: open5gs-webui
  ports:
    - protocol: TCP
      port: 9999
      targetPort: 9999
      nodePort: 30080
