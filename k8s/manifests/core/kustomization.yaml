apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Generates ConfigMaps for the Core Cluster
configMapGenerator:
  - name: open5gs-core-config
    files:
      - configs/services/amf.yaml
      - configs/services/smf.yaml
      - configs/services/upf-gtpu.yaml

  - name: open5gs-mongodb-config
    files:
      - configs/mongo/mongo-init.js

secretGenerator:
  - name: open5gs-core-secrets
    files:
      - tls.key=secrets/server.key
      - tls.crt=secrets/server.crt

images:
  - name: open5gs-webui
    newName: localhost:5001/open5gs-webui
    newTag: latest
  - name: open5gs-run
    newName: localhost:5001/ubuntu-24.04-open5gs-run
    newTag: latest
