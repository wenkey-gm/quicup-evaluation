config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=yes

conn gtpu-tunnel
    type=tunnel          # Transport mode is best for point-to-point 5G traffic
    authby=secret           # Use the PSK from ipsec.secrets
    left=10.10.0.13         # UPF-gtpu-ipsec Local IP
    leftsubnet=10.10.0.13/32
    right=10.10.0.6         # gNB-gtpu-ipsec Remote IP
    rightsubnet=10.10.0.6/32
    ike=aes128gcm16-prfsha256-modp2048!
    esp=aes128gcm16!         # ESP Payload Cipher
    keyexchange=ikev2
    auto=add                # Wait for gNB to initiate the tunnel
