services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../config/metrics/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      shared_network:
        ipv4_address: 10.10.0.29
    ports:
      - "9091:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      shared_network:
        ipv4_address: 10.10.0.30
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=metrics
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  shared_network: {}
