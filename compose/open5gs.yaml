services:
  mongodb:
    image: mongo
    container_name: open5gs-mongodb
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.2
    volumes:
      - mongodb:/data/db
      - ../config/open5gs/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro,Z
    environment:
      - MONGO_INITDB_DATABASE=open5gs
    command: mongod --bind_ip 0.0.0.0 --port 27018

  webui:
    depends_on:
      - mongodb
    build:
      context: ..
      dockerfile: ./config/docker/Dockerfile.open5gs.webui
    image: ${USER}/open5gs-webui
    container_name: open5gs-webui
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.3
    ports:
      - "9999:9999"
    environment:
      - DB_URI=mongodb://10.10.0.2:27018/open5gs
      - WAIT_HOSTS=10.10.0.2:27018
      - HOSTNAME=0.0.0.0

  base:
    build:
      context: ..
      dockerfile: ./config/docker/Dockerfile.base
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-base
    container_name: quicup-project-ubuntu-base
    restart: unless-stopped
    command: /bin/bash -c "echo 'base' services && sleep infinity"

  run:
    depends_on:
      - mongodb
      - base
    pull_policy: never
    build:
      context: ..
      dockerfile: ./config/docker/Dockerfile.open5gs.run
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-latest}
        username: ${USER}
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-open5gs-run
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.10
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    container_name: open5gs-run
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../config/open5gs/services:/usr/local/etc/open5gs:Z
      - ../config/secrets:/secrets:Z
    environment:
      - DB_URI=mongodb://10.10.0.2:27018/open5gs
    command: >
      /bin/bash -c "
      /wait &&
      /root/setup.sh &&
      open5gs-nrfd -D && sleep 2 &&
      open5gs-scpd -D && sleep 2 &&
      open5gs-amfd -D &&
      open5gs-smfd -D &&
      open5gs-ausfd -D &&
      open5gs-udmd -D &&
      open5gs-pcfd -D &&
      open5gs-nssfd -D &&
      open5gs-bsfd -D &&
      open5gs-udrd -D &&
      sleep infinity
      "

  upf-gtpu:
    depends_on:
      - base
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-open5gs-run
    container_name: open5gs-upf-gtpu
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.11
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../config/open5gs/services:/usr/local/etc/open5gs:Z
      - ../config/secrets:/secrets:Z
    command: >
      /bin/bash -c "
      /root/setup.sh &&
      iperf3 -s -B 10.45.0.1 -D &&
      open5gs-upfd -c /usr/local/etc/open5gs/upf-gtpu.yaml
      "

  upf-quic:
    depends_on:
      - base
    image: ${USER}/${DIST-ubuntu}-${TAG-latest}-open5gs-run
    container_name: open5gs-upf-quic
    restart: unless-stopped
    networks:
      shared_network:
        ipv4_address: 10.10.0.12
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../config/open5gs/services:/usr/local/etc/open5gs:Z
      - ../config/secrets:/secrets:Z
    command: >
      /bin/bash -c "
      ip tuntap add name ogstun mode tun 2>/dev/null || true &&
      ip addr del 10.46.0.1/16 dev ogstun 2>/dev/null || true &&
      ip addr add 10.46.0.1/16 dev ogstun &&
      ip addr del 2001:db8:cafe::1/48 dev ogstun 2>/dev/null || true &&
      ip addr add 2001:db8:cafe::1/48 dev ogstun &&
      ip link set ogstun up &&
      iperf3 -s -B 10.46.0.1 -D &&
      open5gs-upfd -c /usr/local/etc/open5gs/upf-quic.yaml
      "

volumes:
  mongodb: {}

networks:
  shared_network: {}
