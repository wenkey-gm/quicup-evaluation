services:
  base:
    profiles: ["build-base"]
    build:
      context: ..
      dockerfile: ./config/docker/Dockerfile.base
      args:
        dist: ${DIST-ubuntu}
        tag: ${TAG-24.04}
        username: ${USER}
    image: ${USER}/${DIST-ubuntu}-${TAG-24.04}-base
    container_name: quicup-project-ubuntu-base
